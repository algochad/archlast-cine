[package]
name = "moviebox-server"
version = "0.1.0"
edition = "2024"
description = "Headless HTTP backend over the moviebox_tui crate: browse, search, resolve streams, and proxy header-authenticated media for web clients."
license = "MIT OR Apache-2.0"

[[bin]]
name = "moviebox-server"
path = "src/main.rs"

[dependencies]
moviebox-tui = { path = ".." }
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
rand = "0.10"
log = "0.4"
env_logger = "0.11"
