name: Update Homebrew Formula

on:
  workflow_run:
    workflows: ["Release"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to mirror into Homebrew (e.g. v0.1.13)"
        required: true

jobs:
  update-homebrew:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Determine ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ github.event.inputs.tag }}"
          else
            REF="${{ github.event.workflow_run.head_sha }}"
          fi
          echo "target_ref=$REF" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.target_ref }}
          fetch-depth: 0

      - name: Skip when no release was published
        id: release_gate
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(grep '^version =' Cargo.toml | head -1 | awk -F'"' '{print $2}')"
          if gh release view "$VERSION" --repo "${{ github.repository }}" --json id > /dev/null 2>&1; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release run finished without publishing $VERSION (no new release). Nothing to do."
            echo "update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get Release Data
        id: release
        if: ${{ steps.release_gate.outputs.update != 'false' }}
        run: |
          VERSION="v$(grep '^version =' Cargo.toml | head -1 | awk -F'"' '{print $2}')"
          CLEAN_VERSION="${VERSION#v}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$VERSION" != "${{ github.event.inputs.tag }}" ]; then
            echo "Cargo.toml version $VERSION does not match requested tag ${{ github.event.inputs.tag }}"
            exit 1
          fi
          echo "version=$CLEAN_VERSION" >> $GITHUB_OUTPUT
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

          BASE_URL="https://github.com/${{ github.repository }}/releases/download/$VERSION"
          curl -fsSL --retry 3 "$BASE_URL/SHA256SUMS" -o SHA256SUMS

          macos_sha=$(awk '$2 == "MovieBox_macOS_Universal.tar.gz" {print $1}' SHA256SUMS)
          linux_x64_sha=$(awk '$2 == "MovieBox_Linux_x64.tar.gz" {print $1}' SHA256SUMS)
          linux_arm64_sha=$(awk '$2 == "MovieBox_Linux_arm64.tar.gz" {print $1}' SHA256SUMS)

          for sha in "$macos_sha" "$linux_x64_sha" "$linux_arm64_sha"; do
            if [[ ! "$sha" =~ ^[0-9a-fA-F]{64}$ ]]; then
              echo "::error::Invalid or missing SHA256 checksum in release manifest: $sha"
              exit 1
            fi
          done

          echo "macos_sha=$macos_sha" >> $GITHUB_OUTPUT
          echo "linux_x64_sha=$linux_x64_sha" >> $GITHUB_OUTPUT
          echo "linux_arm64_sha=$linux_arm64_sha" >> $GITHUB_OUTPUT

      - name: Update Formula
        if: ${{ steps.release_gate.outputs.update != 'false' }}
        run: |
          FORMULA_FILE="Formula/moviebox-tui.rb"
          VERSION="${{ steps.release.outputs.version }}"
          sed -i "s/VERSION = \".*\"/VERSION = \"$VERSION\"/" "$FORMULA_FILE"
          sed -i "s/MACOS_SHA256 = \".*\"/MACOS_SHA256 = \"${{ steps.release.outputs.macos_sha }}\"/" "$FORMULA_FILE"
          sed -i "s/LINUX_X64_SHA256 = \".*\"/LINUX_X64_SHA256 = \"${{ steps.release.outputs.linux_x64_sha }}\"/" "$FORMULA_FILE"
          sed -i "s/LINUX_ARM64_SHA256 = \".*\"/LINUX_ARM64_SHA256 = \"${{ steps.release.outputs.linux_arm64_sha }}\"/" "$FORMULA_FILE"

      - name: Commit and Push Changes
        if: ${{ steps.release_gate.outputs.update != 'false' }}
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(homebrew): update formula to v${{ steps.release.outputs.version }}"
          file_pattern: "Formula/moviebox-tui.rb"
          branch: main
