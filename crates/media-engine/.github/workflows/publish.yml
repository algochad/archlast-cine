name: Publish to Crates.io

on:
  workflow_run:
    workflows: ["Release"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (e.g. v0.1.13)"
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Determine ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ github.event.inputs.tag }}"
          else
            REF="${{ github.event.workflow_run.head_sha }}"
          fi
          echo "target_ref=$REF" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ref.outputs.target_ref }}

      - name: Skip when no release was published or version already exists
        id: release_gate
        if: ${{ github.event_name == 'workflow_run' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -1 | awk -F'"' '{print $2}')
          if ! gh release view "v$VERSION" --repo "${{ github.repository }}" --json id > /dev/null 2>&1; then
            echo "Release run finished without publishing v$VERSION (no new GitHub release). Nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif curl -s -f -o /dev/null -H "User-Agent: github-actions" "https://crates.io/api/v1/crates/moviebox-tui/$VERSION"; then
            echo "Crate moviebox-tui@$VERSION is already published on crates.io. Nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Confirm version
        if: ${{ steps.release_gate.outputs.publish != 'false' }}
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -1 | awk -F'"' '{print $2}')
          echo "Publishing version $VERSION from ${{ steps.ref.outputs.target_ref }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "v$VERSION" != "${{ github.event.inputs.tag }}" ]; then
            echo "Cargo.toml version v$VERSION does not match requested tag ${{ github.event.inputs.tag }}"
            exit 1
          fi

      - name: Install Rust
        if: ${{ steps.release_gate.outputs.publish != 'false' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0

      - name: Publish to crates.io
        if: ${{ steps.release_gate.outputs.publish != 'false' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked
